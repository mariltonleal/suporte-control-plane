name: suporte-control-plane

services:
  control:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    restart: unless-stopped
    environment:
      CONTROL_DATABASE_URL: postgresql://control:${CONTROL_DB_PASSWORD}@control-db:5432/control
      CONTROL_ADMIN_EMAIL: ${CONTROL_ADMIN_EMAIL}
      CONTROL_ADMIN_PASSWORD: ${CONTROL_ADMIN_PASSWORD}
      CONTROL_MASTER_KEY: ${CONTROL_MASTER_KEY}
      # basic (padrao) ou authentik (forward auth do Traefik; valida o X-authentik-jwt com este segredo)
      CONTROL_AUTH_MODE: ${CONTROL_AUTH_MODE:-basic}
      CONTROL_AUTHENTIK_JWT_SECRET: ${CONTROL_AUTHENTIK_JWT_SECRET:-}
      PORTAINER_URL: ${PORTAINER_URL}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY}
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID}
      PORTAINER_SOURCE_ID: ${PORTAINER_SOURCE_ID:-0}
      PORTAINER_GIT_CREDENTIAL_ID: ${PORTAINER_GIT_CREDENTIAL_ID:-0}
      SUPPORT_REPO_URL: ${SUPPORT_REPO_URL}
      SUPPORT_REPO_REF: ${SUPPORT_REPO_REF:-refs/heads/main}
      SUPPORT_COMPOSE_FILE: ${SUPPORT_COMPOSE_FILE:-compose.tenant.yaml}
      SUPPORT_GIT_USERNAME: ${SUPPORT_GIT_USERNAME:-}
      SUPPORT_GIT_TOKEN: ${SUPPORT_GIT_TOKEN:-}
      BASE_DOMAIN: ${BASE_DOMAIN}
      PROXY_NETWORK: ${PROXY_NETWORK:-traefik}
      TRAEFIK_ENTRYPOINT: ${TRAEFIK_ENTRYPOINT:-websecure}
      TRAEFIK_CERTRESOLVER: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      SHARED_TURN_HOST: ${SHARED_TURN_HOST}
      SHARED_TURN_SECRET: ${SHARED_TURN_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN}
      TENANT_SUBNET_PREFIX: ${TENANT_SUBNET_PREFIX:-10.88}
      PROMETHEUS_URL: http://prometheus:9090
      PROM_TARGETS_DIR: /targets
    volumes:
      - prom_targets:/targets
    networks: [internal, proxy]
    depends_on:
      control-db:
        condition: service_healthy
      prometheus:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-traefik}"
      - 'traefik.http.routers.suporte-control.rule=Host(`${CONTROL_HOST}`)'
      - "traefik.http.routers.suporte-control.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.suporte-control.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      # SSO: CONTROL_AUTH_MIDDLEWARE=authentik@docker (forward auth do Authentik). Sem Authentik na VPS, deixe
      # o padrao (so cabecalhos de seguranca) e CONTROL_AUTH_MODE=basic.
      - "traefik.http.routers.suporte-control.middlewares=${CONTROL_AUTH_MIDDLEWARE:-suporte-control-headers@docker},suporte-control-headers@docker"
      - "traefik.http.services.suporte-control.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.suporte-control-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.suporte-control-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.suporte-control-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.suporte-control-headers.headers.referrerPolicy=no-referrer"
      # Callback do login do Authentik neste dominio (mesmo padrao do Portainer do hub). So faz sentido com
      # CONTROL_AUTH_MIDDLEWARE=authentik@docker; sem o servico `authentik` no Traefik este router fica em erro
      # e os demais continuam normais.
      - 'traefik.http.routers.suporte-control-outpost.rule=Host(`${CONTROL_HOST}`) && PathPrefix(`/outpost.goauthentik.io/`)'
      - "traefik.http.routers.suporte-control-outpost.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.suporte-control-outpost.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.suporte-control-outpost.priority=100"
      - "traefik.http.routers.suporte-control-outpost.service=${CONTROL_AUTH_OUTPOST_SERVICE:-suporte-control@docker}"
    mem_limit: 384m
    cpus: 1
    security_opt: ["no-new-privileges:true"]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  control-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD}
    volumes: [control_db:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U control -d control"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  metrics-init:
    image: alpine:3.22
    restart: "no"
    # Sem rede: nao precisa dela, e um servico sem `networks` faria o Compose criar a rede
    # `<stack>_default` sem sub-rede — nesta VPS isso falha (pools esgotados).
    network_mode: none
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
      NODE_EXPORTER_PASSWORD: ${NODE_EXPORTER_PASSWORD}
      # base64: o hash bcrypt e cheio de `$` e o Compose/Portainer interpolam `$x` nos valores do env-file.
      NODE_EXPORTER_PASSWORD_HASH_B64: ${NODE_EXPORTER_PASSWORD_HASH_B64}
    # O volume nasce vazio e pertencente ao root. O control (uid 10002) precisa escrever tenants.json
    # e o Prometheus (uid 65534, nobody) precisa ler o token: ajusta dono/permissoes antes dos dois subirem.
    # Tambem grava a senha (para o Prometheus) e o hash bcrypt (para o node-exporter) da porta 9101 do host.
    # `$$VAR`: o sh le a variavel do ambiente do container; com `$VAR` o Compose interpolaria o valor
    # dentro do comando e o hash bcrypt (cheio de `$`) seria mastigado pelo shell.
    command: ["sh","-c","umask 027; printf '%s' \"$$METRICS_TOKEN\" > /targets/metrics.token; printf '%s' \"$$NODE_EXPORTER_PASSWORD\" > /targets/node-exporter.password; printf 'basic_auth_users:\\n  prometheus: \"%s\"\\n' \"$(printf '%s' \"$$NODE_EXPORTER_PASSWORD_HASH_B64\" | base64 -d)\" > /targets/node-exporter-web.yml; test -f /targets/tenants.json || printf '[]' > /targets/tenants.json; chown -R 10002:65534 /targets; chmod 750 /targets; chmod 640 /targets/*"]
    volumes: [prom_targets:/targets]

  prometheus:
    build:
      context: ./monitoring/prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - prom_data:/prometheus
      - prom_targets:/etc/prometheus/targets:ro
    # proxy: a rede `internal` e isolada (internal: true); sem a rede do Traefik o Prometheus
    # nao alcanca https://<cliente>:443 e nenhum tenant seria coletado.
    networks: [internal, proxy]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      metrics-init:
        condition: service_completed_successfully
    mem_limit: 768m
    cpus: 1
    logging: *logging

  grafana:
    build:
      context: ./monitoring/grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}
      # OIDC nativo (Authentik): GRAFANA_OAUTH_ENABLED=true + client id/secret do provider oauth-suporte-grafana.
      # Grupo suporte-grafana-admin -> Admin, suporte-grafana -> Viewer, sem grupo = negado. `admin` local continua.
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OAUTH_NAME:-Krato}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${AUTHENTIK_URL:-https://auth.krato.ai}/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${AUTHENTIK_URL:-https://auth.krato.ai}/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: ${AUTHENTIK_URL:-https://auth.krato.ai}/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: ${AUTHENTIK_URL:-https://auth.krato.ai}/application/o/${GRAFANA_OAUTH_APP_SLUG:-suporte-grafana}/end-session/
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], '${GRAFANA_OAUTH_ADMIN_GROUP:-suporte-grafana-admin}') && 'Admin' || contains(groups[*], '${GRAFANA_OAUTH_VIEWER_GROUP:-suporte-grafana}') && 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      # true = abrir o Grafana ja manda para o Authentik (sem formulario local). Emergencia com o admin local:
      # https://<GRAFANA_HOST>/login?disableAutoLogin=true
      GF_AUTH_OAUTH_AUTO_LOGIN: ${GRAFANA_OAUTH_AUTO_LOGIN:-false}
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_OAUTH_AUTO_LOGIN:-false}
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [internal, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-traefik}"
      - 'traefik.http.routers.suporte-grafana.rule=Host(`${GRAFANA_HOST}`)'
      - "traefik.http.routers.suporte-grafana.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.suporte-grafana.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.suporte-grafana.loadbalancer.server.port=3000"
    mem_limit: 384m
    cpus: 0.75
    logging: *logging

  docker-exporter:
    # Substitui o cAdvisor: com o Docker no snapshotter do containerd (caso do hub) o cAdvisor descarta
    # todos os containers ("failed to identify the read-write layer ID"). Mesmos nomes/labels de metricas.
    build:
      context: ./monitoring/docker-exporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    # network_mode host: dentro de uma rede bridge o /proc/net/dev e o da propria bridge e a rede da VPS
    # sai zerada. Na rede do host a porta fica publica, por isso 9101 exige basic auth (web.yml).
    # ignored-devices: o hub tem dezenas de interfaces veth/br-; sem isso o collector netclass
    # leva varios segundos por coleta (incidente ja visto no node_exporter nativo desta VPS).
    command:
      - --path.rootfs=/host
      - --web.listen-address=:${NODE_EXPORTER_PORT:-9101}
      - --web.config.file=/targets/node-exporter-web.yml
      - --collector.processes
      - --collector.netclass.ignored-devices=^(veth.*|br-.*|docker0|lo)$$
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|run|host/(sys|proc|dev|run))($$|/)
    network_mode: host
    pid: host
    depends_on:
      metrics-init:
        condition: service_completed_successfully
    volumes:
      - /:/host:ro,rslave
      - prom_targets:/targets:ro
    mem_limit: 128m
    cpus: 0.25
    logging: *logging

volumes:
  control_db:
  prom_data:
  prom_targets:
  grafana_data:

networks:
  internal:
    internal: true
    # Sub-rede fixa: nesta VPS os pools padrao do Docker estao esgotados
    # ("all predefined address pools have been fully subnetted"). Fica fora do pool dos clientes (10.88.1-250).
    ipam:
      config:
        - subnet: ${CONTROL_SUBNET:-10.88.0.0/24}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-traefik}
