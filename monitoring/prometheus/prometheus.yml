global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/targets/node-exporter.password
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: containers
    static_configs:
      - targets: ["docker-exporter:8080"]

  - job_name: tenant-app
    scheme: https
    metrics_path: /api/ops/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/targets/metrics.token
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/tenants.json
        refresh_interval: 30s
